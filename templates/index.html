<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Welcome to the GUDLFT Registration Portal!</h1>
        <p class="text-slate-600 mb-6">Please enter your secretary email to continue:</p>
        <form action="showSummary" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" id="email" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2">Enter</button>
        </form>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="mt-4 space-y-2">
            {% for message in messages %}
            <li class="rounded-lg bg-red-50 border border-red-200 text-red-700 px-3 py-2 text-sm">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}
        <a href="/points" class="block mt-6 text-center text-indigo-600 hover:underline text-sm">See the points of all clubs</a>
    </main>
</body>
</html>
