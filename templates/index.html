{% extends "base.html" %}
{% block titre %}Connexion | GUDLFT{% endblock %}
{% block contenu %}
<section class="max-w-md mx-auto bg-white rounded-2xl shadow-md border border-vert-100 overflow-hidden">
    <div class="h-1.5 bg-gradient-to-r from-vert-600 via-vert-400 to-orange-400"></div>
    <div class="p-8">
        <h1 class="font-serif text-2xl text-vert-800 mb-2">Bienvenue sur le portail d'inscription</h1>
        <p class="text-stone-600 mb-6">Saisissez l'adresse e-mail de votre secrétariat pour continuer.</p>
        <form action="{{ url_for('showSummary') }}" method="post" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-vert-800 mb-1">Adresse e-mail</label>
                <input type="email" name="email" id="email" required
                       class="w-full rounded-lg border border-vert-200 bg-creme px-3 py-2 placeholder-stone-400 focus:outline-none focus:border-vert-500 focus:ring-2 focus:ring-orange-300"/>
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-vert-700 hover:bg-vert-800 text-white font-semibold py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-400">Se connecter</button>
        </form>
        <a href="/points" class="block mt-6 text-center text-sm text-vert-700 hover:text-orange-700 underline underline-offset-4">Voir les points de tous les clubs</a>
    </div>
</section>
{% endblock %}
