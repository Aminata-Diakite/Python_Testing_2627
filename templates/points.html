<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs points | GUDLFT</title>
</head>
<body>
    <h1>Points of all clubs</h1>
    <a href="/">Back to login</a>
    <table>
        <thead>
            <tr><th>Club</th><th>Points</th></tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr><td>{{ club['name'] }}</td><td>{{ club['points'] }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
