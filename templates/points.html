<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs points | GUDLFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4">
    <main class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Points of all clubs</h1>
        <a href="/" class="text-sm text-indigo-600 hover:underline">Back to login</a>
        <table class="w-full mt-6 text-left">
            <thead>
                <tr class="border-b border-slate-200 text-slate-600">
                    <th class="py-2">Club</th><th class="py-2">Points</th>
                </tr>
            </thead>
            <tbody>
                {% for club in clubs %}
                <tr class="border-b border-slate-100"><td>{{ club['name'] }}</td><td>{{ club['points'] }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
